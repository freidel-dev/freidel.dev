services:
  web:
    # Build the image from the Dockerfile in this folder
    build: .
    container_name: freidel-web
    # Restart after crashes and after the host reboots (unless you stopped it)
    restart: unless-stopped
    environment:
      # Local default is plain HTTP. For production, create a .env file next to
      # this one containing: SITE_ADDRESS=freidel.dev
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"      # HTTP (also used for Let's Encrypt validation and HTTPS redirect)
      - "443:443"    # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      # Persist certificates, otherwise every rebuild re-requests them
      # and you can hit Let's Encrypt rate limits
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
