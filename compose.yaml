services:
  web:
    # Build the image from the Dockerfile in this folder
    build: .
    container_name: freidel-web
    # Restart after crashes and after the host reboots (unless you stopped it)
    restart: unless-stopped
    environment:
      # nginx terminates HTTPS in front of this container, so Caddy serves plain
      # HTTP on port 80 inside the container (no certificates, no redirects).
      # Set here, not read from .env, so a stray .env can't switch HTTPS back on.
      SITE_ADDRESS: ":80"
    ports:
      # host 127.0.0.1:8080 -> container port 80
      # Bound to loopback so only programs on this machine (nginx) can reach it,
      # not the internet. If nginx runs on a different machine, use "8080:80".
      - "127.0.0.1:8080:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
